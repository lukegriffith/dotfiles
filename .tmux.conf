bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
set -g mouse on

setw -g mode-keys vi

bind-key -T copy-mode-vi v send-keys -X begin-selection
unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'reattach-to-user-namespace pbcopy'
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'reattach-to-user-namespace pbcopy'
bind-key -T copy-mode-vi C-c send-keys -X copy-pipe-and-cancel 'reattach-to-user-namespace pbcopy'
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 're-attach-to-user-namespace pbcopy'

bind-key C-u run-shell -b "tmux capture-pane -J -p | grep -oE '(https?):\/\/.*[^>]' | fzf-tmux -d20 --multi --bind alt-a:select-all,alt-d:deselect-all --preview '' | xargs open"

unbind r
bind r source-file ~/.tmux.conf

set-option -g renumber-windows on
set-option -sg escape-time 10
set-option -g focus-events on
set-option -a terminal-features 'screen-256color:RGB'

set -g history-limit 99999

# Smart pane switching with awareness of Vim splits.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'

if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -n 'C-Space' if-shell "$is_vim" 'send-keys C-Space' 'select-pane -t:.+'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-Space' select-pane -t:.+

# Arasaka status bar
set -g default-terminal "screen-256color"
set -g status-position top
set -g status-style "bg=#080008,fg=#f0d0cc"
set -g status-left '          '
set -g status-right-length 200

set -g automatic-rename off

set -g window-status-format         "#[bg=#1a0505,fg=#7a4a44] #I:#W "
set -g window-status-current-format "#[bg=#3d1010,fg=#ffaa00,bold] #I:#W "
set -g window-status-separator ""

set -g status-right "#[bg=#1a0505,fg=#7a4a44] #{pane_current_command} #[bg=#3d1010,fg=#ffaa00,bold] %H:%M #[bg=#ff0022,fg=#080008,bold] #S "

set -g pane-active-border-style fg=#ffaa00,bg=default
set -g pane-border-style fg=#3d1010,bg=default
set -g message-style "bg=#3d1010,fg=#ff0022"
set -g message-command-style "bg=#1a0505,fg=#ffaa00"
set -g mode-style "bg=#3d1010,fg=#ffaa00"

# Plugins
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'hiroppy/tmux-agent-sidebar'
set -g @plugin 'tmux-plugins/tpm'

# tmux-agent-sidebar: default off, toggle prefix + e (built-in default key)
set -g @sidebar_auto_create off

run '~/.tmux/plugins/tpm/tpm'

set -g allow-rename off
